<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Album{% endblock %}</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; }
    main { width: min(920px, calc(100% - 32px)); margin: 32px auto; }
    nav { display: flex; gap: 16px; align-items: center; padding: 16px max(16px, calc((100% - 920px) / 2)); background: white; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    nav a { color: #1857c9; text-decoration: none; font-weight: 650; }
    .card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 8px 28px rgba(20,35,70,.08); margin-bottom: 20px; }
    .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .metric { background: #f2f5fb; border-radius: 10px; padding: 12px; }
    .metric strong { display: block; font-size: 1.2rem; margin-top: 4px; }
    input[type=file] { display: block; width: 100%; box-sizing: border-box; padding: 18px; border: 2px dashed #a8b5ce; border-radius: 12px; background: #fafcff; }
    button, input[type=submit] { border: 0; border-radius: 10px; background: #2463eb; color: white; padding: 12px 18px; font-size: 1rem; cursor: pointer; }
    .secondary { background: #5f6b7a; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .muted { color: #637083; }
    .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; border-top: 1px solid #edf0f5; padding: 16px 0; }
    .thumb { max-width: 100%; max-height: 220px; border-radius: 8px; }
    code { overflow-wrap: anywhere; }
    @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } main { margin-top: 20px; } }
  </style>
</head>
<body>
<nav><a href="/">Upload</a><a href="/duplicates">Duplicate Images</a></nav>
<main>{% block content %}{% endblock %}</main>
<script>
async function refreshStatus() {
  const target = document.querySelector('[data-detection-status]');
  if (!target) return;
  try {
    const response = await fetch('/api/detection/status');
    const status = await response.json();
    target.querySelector('[data-state]').textContent = status.state ?? '-';
    target.querySelector('[data-backend]').textContent = status.backend ?? '-';
    target.querySelector('[data-files]').textContent = status.files_found ?? status.last_batch_processed ?? 0;
    target.querySelector('[data-duplicates]').textContent = status.duplicates ?? status.last_batch_duplicates ?? 0;
    target.querySelector('[data-time]').textContent = status.elapsed_seconds ?? 0;
  } catch (error) { console.error(error); }
}
refreshStatus();
setInterval(refreshStatus, 1500);
async function requestRescan() {
  await fetch('/api/detection/rescan', {method: 'POST'});
  refreshStatus();
}
</script>
</body>
</html>
